name: PR title

# Checks that a pull request title follows Conventional Commits: type(scope): description.
# With squash merges the PR title becomes the commit message on main, so this keeps the history readable
# and lets release tooling build a changelog later.
# It reads the title only: no checkout, no token permissions, and the title never reaches a shell
# as code (it is passed through an environment variable).

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          types='feat|fix|refactor|perf|docs|test|build|ci|chore'
          conventional="^(${types})(\([a-z0-9._/-]+\))?!?: [^[:space:]]"
          # GitHub's own "Revert" button titles the PR: Revert "feat: add x"
          revert='^Revert ".+"$'
          if [[ "$TITLE" =~ $conventional || "$TITLE" =~ $revert ]]; then
            echo "Title OK: $TITLE"
          else
            echo "::error::The title must look like type(scope): description. Allowed types: feat, fix, refactor, perf, docs, test, build, ci, chore. Example: fix(cli): keep the config file when the input is invalid. Your title: $TITLE"
            exit 1
          fi
