name: CI

# Hosted runners have no GPU: GPU tests are marked `gpu` and skipped here (-m "not gpu").
# Run them on your own machine and report them under "Validation" in the pull request.
#
# Three test jobs: `test` runs the unit tests with the CPU torch build, which includes the small end-to-end tests
# of tests/e2e (the tiny GPT-2 on the CPU, no network); `adapters` runs the integration tests (real HuggingFace
# and tiktoken tokenizers, spawned worker processes) with the optional extras and no torch; `parity` runs the
# integration tests that need torch and `transformers` together, among them real GPT-2 against `transformers`.
# Keep them apart: the integration tests need packages that the unit tests must work without.
#
# Caching: only the uv cache is cached (keyed on uv.lock). Pyright ships bundled in its wheel and uses the
# runner's Node.js, and ruff runs in milliseconds, so neither needs a cache of its own.
#
# PyTorch: lint, test and parity install the CPU build (`--extra cpu`); hosted runners have no GPU, and the CPU
# wheel avoids the ~15 nvidia-* packages the default Linux build pulls in. adapters, build and workflows install
# no torch. The uv cache is not pruned in those three jobs: pruning drops prebuilt wheels, so torch would be downloaded
# from download.pytorch.org on every run. This is a reasoned default, not a measurement: compare the
# "Install" step time with prune-cache true/false on a real run before keeping it.
#
# Network: `parity` is the one job that needs it at run time, to download the GPT-2 checkpoint (about 0.5 GB) from
# the Hugging Face Hub. The Hub cache is restored by model id, and saved only from main (like the uv cache). The
# job sets AYAKA_REQUIRE_REAL_MODEL=1, so a download that fails turns the job red instead of skipping the test.
# Actions are pinned to a full commit SHA with the version in a comment. There is no dependabot: a maintainer
# bumps the pins by hand, reads the diff and commits it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel superseded runs on a PR, but never cancel a run on main.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_LOCKED: "1"  # fail if uv.lock is out of date instead of silently re-resolving
  UV_NO_PROGRESS: "1"
  FORCE_COLOR: "1"
  PYTEST_ADDOPTS: "--color=yes"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock  # not pyproject.toml: editing tool settings must not bust the cache
          cache-suffix: lint
          prune-cache: false  # keep the prebuilt torch wheel; see the note at the top
          # PRs restore the cache that main saved but do not save their own, which keeps the 10 GB repo quota free.
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - run: uv sync --extra cpu
      - run: uv run ruff check . --output-format=github
      - run: uv run ruff format --check .
      - run: uv run pyright

  # Ubuntu only for now. Add windows-latest / macos-latest back as a matrix once there is code that behaves
  # differently per OS (paths, native builds); they cost minutes and cache space for no signal today.
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: test
          prune-cache: false  # keep the prebuilt torch wheel; see the note at the top
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - run: uv sync --extra cpu
      - run: uv run pytest -m "not gpu and not integration" --cov --cov-report=term-missing
      - run: uv run pytest --doctest-modules python/ayaka

  # Integration tests: they load real tokenizers built from scratch (no download) and spawn worker processes.
  # No torch is installed, so this job is light; the extras come from uv.lock like everything else.
  adapters:
    name: adapters
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: adapters
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - run: uv sync --extra hf --extra tiktoken
      - run: uv run pytest -m integration

  # Real GPT-2 against `transformers` (greedy, token by token), plus the other tests that need torch and
  # `transformers` together (tests/models: GPT-2 and Llama; tests/layers: the rotary frequencies; tests/model_loader).
  # Needs the network the first time: see the note at the top. The extras come from uv.lock like everything else.
  parity:
    name: parity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AYAKA_REQUIRE_REAL_MODEL: "1"  # a missing checkpoint or package fails the job; it never skips
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: parity
          prune-cache: false  # keep the prebuilt torch wheel; see the note at the top
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - name: Restore the Hugging Face cache
        id: hf-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface/hub
          key: hf-hub-openai-community-gpt2-v1  # the model id of tests/e2e/test_gpt2_parity.py; bump the suffix to refresh
      - run: uv sync --extra cpu --extra hf --extra tiktoken
      - run: uv run pytest -m integration tests/e2e/test_gpt2_parity.py tests/models tests/layers tests/model_loader
      - name: Save the Hugging Face cache
        if: github.ref == 'refs/heads/main' && steps.hf-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface/hub
          key: hf-hub-openai-community-gpt2-v1

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # This job produces the artifacts that will become releases: never restore a cache into it.
          enable-cache: false
      - run: uv build

  # Lints the workflows themselves (syntax, expressions, and security issues such as template injection).
  workflows:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: uvx --from actionlint-py==1.7.12.25 actionlint
      - run: uvx zizmor@1.32.0 --offline --color never .github

  # One stable name for branch protection. Require only "CI OK": adding or renaming a matrix entry above then
  # never needs a settings change, and a skipped or cancelled job cannot be mistaken for a pass.
  ci-ok:
    name: CI OK
    if: always()
    needs: [lint, test, adapters, parity, build, workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the results of the required jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A required job finished as '$result', not 'success'."
              exit 1
            fi
          done
