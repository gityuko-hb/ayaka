[package]
name = "ayaka-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
keywords.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
# CUDA swaps the vanilla-Candle layer ops for ayaka's fused kernels.
cuda = [
    "candle-core/cuda",
    "candle-nn/cuda",
    "ayaka-loader/cuda",
    "ayaka-memory/cuda",
    "ayaka-candle/cuda",
]

[dependencies]
ayaka-loader = { path = "../ayaka-loader" }
ayaka-registry = { path = "../ayaka-registry" }
ayaka-memory = { path = "../ayaka-memory" }
# Provides `QuantLinear` (W4A16) for the quantized model variant. The CPU path
# (`quant_gemm_ref`) is always available; the `cuda` feature enables the native
# kernel dispatch.
ayaka-candle = { path = "../ayaka-candle" }
ayaka-quant = { path = "../ayaka-quantization" }
candle-core.workspace = true
candle-nn.workspace = true
half.workspace = true

[dev-dependencies]
tempfile.workspace = true
