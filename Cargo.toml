[workspace]
resolver = "2"

members = [
    "crates/*"
]

exclude = [
    "crates/*/target",
    "crates/*/tests",
    "crates/*/examples",
    "crates/*/benches",
]

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.92"
authors      = ["Yumeio"]
license      = "Apache-2.0"
repository   = "https://github.com/gityuko-hb/ayaka"
homepage     = "https://github.com/gityuko-hb/ayaka"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3

[workspace.dependencies]
anyhow = "1.0.100"
schemars = "1.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filt`er"] }
base64 = "0.22.1"
candle_core = "0.3"
candle_nn = "0.3"
chrono = "0.4.44"
futures = "0.3.32"
half = "2.7.1"
indicatif ={ version = "0.18.4", features = ["rayon"] }
libc = "0.2.186"
memmap2 = "0.9.10"
rand = "0.10.1"
rayon = "1.12.0"
regex = "1.12.3"
tempfile = "3.27.0"
tokio = "1.52.3"
tokenizers = "0.23.1"

[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 8
opt-level = 2
strip = false

[profile.bench]
inherits        = "release"
strip           = "none"
debug           = 1